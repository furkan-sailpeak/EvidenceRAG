# make db  -> only the database (for make ocr / ingest / embed / dev)
# make up  -> database + the app on http://localhost:8080
name: evidencerag

services:
  db:
    image: pgvector/pgvector:pg16          # Postgres with the vector extension
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"                        # 5433 on your machine, so it never clashes with another Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data/pdfs:/srv/data/pdfs:ro      # cited PDFs are served from here
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
