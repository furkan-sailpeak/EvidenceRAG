[tool.ruff]
target-version = "py311"
line-length = 120
include = ["backend/**/*.py", "eval/**/*.py", "setup/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: long SQL strings and prompt text read better unwrapped.
# B905: zip() strictness adds noise for equal-length pairs built one line apart.
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
